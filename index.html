<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tchoutchou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a24;
    --bg-2: #25252f;
    --text: #f5f5f5;
    --muted: #9aa0a6;
    --tile-radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Fredoka', system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body { min-height: 100vh; min-height: 100dvh; }

  /* ----- HOME ----- */
  #home {
    padding: 24px 16px 40px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1.title {
    font-size: clamp(2.6rem, 10vw, 4rem);
    font-weight: 700;
    text-align: center;
    margin: 16px 0 28px;
    letter-spacing: 0.5px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .tile {
    aspect-ratio: 1 / 1;
    border-radius: var(--tile-radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.2s ease;
    border: none;
    font: inherit;
    color: inherit;
    padding: 8px;
  }
  .tile:not(:disabled):active { transform: scale(0.96); }
  .tile:disabled { opacity: 0.35; cursor: not-allowed; }
  .tile .label {
    font-size: 1.6rem;
    font-weight: 600;
    text-transform: lowercase;
    line-height: 1;
    margin-bottom: 6px;
  }
  .tile .count {
    font-size: 2.6rem;
    font-weight: 700;
    line-height: 1;
  }
  .aleatoire-row {
    margin-top: 14px;
  }
  .tile.aleatoire {
    aspect-ratio: auto;
    width: 100%;
    padding: 22px 16px;
    background: #3a3a48;
    color: var(--text);
    flex-direction: row;
    gap: 18px;
  }
  .tile.aleatoire .qmark {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
  }
  .tile.aleatoire .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .tile.aleatoire .label {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  .tile.aleatoire .count {
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--muted);
  }

  /* ----- DISPLAY ----- */
  #display {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  .display-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-2);
    flex-shrink: 0;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .back-btn:active { background: rgba(255,255,255,0.08); }
  .display-count {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
  }
  .display-count .num { color: var(--text); }

  .train-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    touch-action: none;
  }
  .train-scroll {
    will-change: transform;
    display: inline-block;
    line-height: 0;
  }
  .train-scroll img {
    display: block;
    max-height: none;
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .fade {
    position: absolute;
    top: 0; bottom: 0;
    width: 36px;
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.2s ease;
  }
  .fade-left {
    left: 0;
    background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
    opacity: 0;
  }
  .fade-right {
    right: 0;
    background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
    opacity: 0;
  }

  .change-bar {
    flex-shrink: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--bg-2);
  }
  .change-btn {
    width: 100%;
    padding: 16px;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 600;
    background: #ffffff;
    color: #1a1a24;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  .change-btn:not(:disabled):active { transform: scale(0.98); }
  .change-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<section id="home">
  <h1 class="title">Tchoutchou</h1>
  <div class="grid" id="grid"></div>
  <div class="aleatoire-row" id="aleatoire-row"></div>
</section>

<section id="display" hidden>
  <header class="display-header">
    <button class="back-btn" id="back-btn" aria-label="Retour">← Tchoutchou</button>
    <div class="display-count"><span class="num" id="count-num">0</span> <span id="count-label">trains</span></div>
  </header>
  <div class="train-viewport" id="viewport">
    <div class="fade fade-left" id="fade-left"></div>
    <div class="fade fade-right" id="fade-right"></div>
    <div class="train-scroll" id="scroll">
      <img id="train-img" alt="">
    </div>
  </div>
  <div class="change-bar">
    <button class="change-btn" id="change-btn">Changer de train</button>
  </div>
</section>

<script>
'use strict';

const PALETTE = {
  rouge: '#e53935',
  bleu: '#1e88e5',
  vert: '#43a047',
  jaune: '#fdd835',
  blanc: '#fafafa',
  noir: '#212121',
  orange: '#fb8c00',
  rose: '#ec407a',
  violet: '#8e24aa',
  gris: '#9e9e9e',
};
const DARK_TEXT_COLORS = new Set(['jaune', 'blanc']);

function tileBg(name) { return PALETTE[name] || '#5a5a6e'; }
function tileFg(name) { return DARK_TEXT_COLORS.has(name) ? '#212121' : '#ffffff'; }

const COUNT_LABELS = {
  rouge: 'rouges', bleu: 'bleus', vert: 'verts',
  jaune: 'jaunes', blanc: 'blancs', noir: 'noirs',
  orange: 'oranges', rose: 'roses', violet: 'violets', gris: 'gris',
};
function countLabel(color, n) {
  if (color === 'aleatoire') return n > 1 ? 'trains' : 'train';
  const base = COUNT_LABELS[color] || color + 's';
  return n > 1 ? base : base.replace(/s$/, '');
}

let manifest = {};
let unionList = [];
let currentColor = null;
let currentTrain = null;
let scroller = null;

async function loadManifest() {
  try {
    const res = await fetch('manifest.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    manifest = await res.json();
  } catch (e) {
    console.error('manifest.json introuvable', e);
    manifest = {};
  }
  unionList = [];
  for (const [color, files] of Object.entries(manifest)) {
    for (const f of files) unionList.push({ color, file: f });
  }
}

/* ---------- HOME ---------- */
function renderHome() {
  const grid = document.getElementById('grid');
  const aleaRow = document.getElementById('aleatoire-row');
  grid.innerHTML = '';
  aleaRow.innerHTML = '';

  const colors = Object.keys(manifest).sort();
  for (const c of colors) {
    const n = manifest[c].length;
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.style.background = tileBg(c);
    btn.style.color = tileFg(c);
    btn.innerHTML = `<div class="label">${c}</div><div class="count">${n}</div>`;
    btn.disabled = n === 0;
    btn.addEventListener('click', () => { location.hash = '#/affichage/' + encodeURIComponent(c); });
    grid.appendChild(btn);
  }

  const total = unionList.length;
  const alea = document.createElement('button');
  alea.className = 'tile aleatoire';
  alea.innerHTML = `<div class="qmark">?</div><div class="meta"><div class="label">aléatoire</div><div class="count">${total} train${total > 1 ? 's' : ''}</div></div>`;
  alea.disabled = total === 0;
  alea.addEventListener('click', () => { location.hash = '#/affichage/aleatoire'; });
  aleaRow.appendChild(alea);
}

/* ---------- RUBBER-BAND SCROLLER ---------- */
class RubberScroller {
  constructor(viewport, scroll, fadeLeft, fadeRight) {
    this.viewport = viewport;
    this.scroll = scroll;
    this.fadeLeft = fadeLeft;
    this.fadeRight = fadeRight;
    this.img = scroll.querySelector('img');
    this.pos = 0;
    this.vel = 0;
    this.minPos = 0;
    this.maxPos = 0;
    this.dragging = false;
    this.startX = 0;
    this.startPos = 0;
    this.lastMoveX = 0;
    this.lastMoveT = 0;
    this.raf = null;

    const onDown = (x) => {
      this.dragging = true;
      this.startX = x;
      this.startPos = this.pos;
      this.lastMoveX = x;
      this.lastMoveT = performance.now();
      this.vel = 0;
      if (this.raf) cancelAnimationFrame(this.raf);
      this.raf = null;
    };
    const onMove = (x) => {
      if (!this.dragging) return;
      const delta = x - this.startX;
      let newPos = this.startPos + delta;
      if (newPos > this.maxPos) {
        newPos = this.maxPos + (newPos - this.maxPos) * 0.3;
      } else if (newPos < this.minPos) {
        newPos = this.minPos - (this.minPos - newPos) * 0.3;
      }
      const now = performance.now();
      const dt = now - this.lastMoveT;
      if (dt > 0) this.vel = ((x - this.lastMoveX) / dt) * 16;
      this.lastMoveX = x;
      this.lastMoveT = now;
      this.pos = newPos;
      this.render();
    };
    const onUp = () => {
      if (!this.dragging) return;
      this.dragging = false;
      this.startAnim();
    };

    viewport.addEventListener('touchstart', e => onDown(e.touches[0].clientX), { passive: true });
    viewport.addEventListener('touchmove', e => { onMove(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
    viewport.addEventListener('touchend', onUp);
    viewport.addEventListener('touchcancel', onUp);

    viewport.addEventListener('mousedown', e => { onDown(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', e => onMove(e.clientX));
    window.addEventListener('mouseup', onUp);

    viewport.addEventListener('wheel', e => {
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      let newPos = this.pos - delta;
      if (newPos > this.maxPos) newPos = this.maxPos + (newPos - this.maxPos) * 0.3;
      else if (newPos < this.minPos) newPos = this.minPos - (this.minPos - newPos) * 0.3;
      this.pos = newPos;
      this.vel = -delta / 2;
      this.render();
      if (!this.raf) this.startAnim();
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('resize', () => { this.computeBounds(); this.clampAndRender(); });
  }

  computeBounds() {
    const imgW = this.img.naturalWidth ? this.img.offsetWidth : 0;
    const vpW = this.viewport.clientWidth;
    this.maxPos = 0;
    this.minPos = Math.min(0, vpW - imgW);
  }

  clampAndRender() {
    if (this.pos > this.maxPos) this.pos = this.maxPos;
    if (this.pos < this.minPos) this.pos = this.minPos;
    this.render();
  }

  startAnim() {
    const step = () => {
      if (this.dragging) { this.raf = null; return; }
      let busy = false;
      if (this.pos > this.maxPos) {
        const d = this.maxPos - this.pos;
        this.pos += d * 0.22;
        this.vel = 0;
        if (Math.abs(d) < 0.4) this.pos = this.maxPos;
        else busy = true;
      } else if (this.pos < this.minPos) {
        const d = this.minPos - this.pos;
        this.pos += d * 0.22;
        this.vel = 0;
        if (Math.abs(d) < 0.4) this.pos = this.minPos;
        else busy = true;
      } else {
        this.pos += this.vel;
        this.vel *= 0.93;
        if (Math.abs(this.vel) > 0.15) busy = true;
      }
      this.render();
      if (busy) this.raf = requestAnimationFrame(step);
      else this.raf = null;
    };
    if (!this.raf) this.raf = requestAnimationFrame(step);
  }

  render() {
    this.scroll.style.transform = `translate3d(${this.pos}px, 0, 0)`;
    const leftOpacity = Math.min(1, Math.max(0, (this.maxPos - this.pos) / 24));
    const rightOpacity = Math.min(1, Math.max(0, (this.pos - this.minPos) / 24));
    this.fadeLeft.style.opacity = leftOpacity;
    this.fadeRight.style.opacity = rightOpacity;
  }

  setImage(src) {
    return new Promise(resolve => {
      this.pos = 0;
      this.vel = 0;
      if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
      this.scroll.style.transform = 'translate3d(0,0,0)';
      this.img.onload = () => {
        this.computeBounds();
        this.render();
        resolve();
      };
      this.img.onerror = () => resolve();
      this.img.src = src;
    });
  }
}

/* ---------- DISPLAY ---------- */
function pickRandom(list, exclude) {
  const candidates = exclude ? list.filter(x => x !== exclude) : list.slice();
  if (candidates.length === 0) return list[0] || null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function imgPath(color, file) { return color + '/' + file; }

async function enterDisplay(color) {
  document.getElementById('home').hidden = true;
  document.getElementById('display').hidden = false;
  currentColor = color;

  if (!scroller) {
    scroller = new RubberScroller(
      document.getElementById('viewport'),
      document.getElementById('scroll'),
      document.getElementById('fade-left'),
      document.getElementById('fade-right'),
    );
  }

  let pool, count;
  if (color === 'aleatoire') {
    pool = unionList;
    count = unionList.length;
  } else {
    const files = manifest[color] || [];
    pool = files.map(f => ({ color, file: f }));
    count = files.length;
  }

  document.getElementById('count-num').textContent = count;
  document.getElementById('count-label').textContent = countLabel(color, count);

  const changeBtn = document.getElementById('change-btn');
  changeBtn.disabled = count <= 1;

  if (count === 0) {
    document.getElementById('train-img').removeAttribute('src');
    currentTrain = null;
    return;
  }

  const pick = pool[Math.floor(Math.random() * pool.length)];
  currentTrain = pick;
  await scroller.setImage(imgPath(pick.color, pick.file));
}

function changeTrain() {
  if (!currentColor) return;
  let pool;
  if (currentColor === 'aleatoire') pool = unionList;
  else pool = (manifest[currentColor] || []).map(f => ({ color: currentColor, file: f }));
  if (pool.length <= 1) return;
  let next;
  do {
    next = pool[Math.floor(Math.random() * pool.length)];
  } while (next.file === currentTrain?.file && next.color === currentTrain?.color);
  currentTrain = next;
  scroller.setImage(imgPath(next.color, next.file));
}

function leaveDisplay() {
  document.getElementById('display').hidden = true;
  document.getElementById('home').hidden = false;
  currentColor = null;
  currentTrain = null;
}

/* ---------- ROUTER ---------- */
function route() {
  const hash = location.hash || '#/';
  const m = hash.match(/^#\/affichage\/([^/]+)$/);
  if (m) {
    const color = decodeURIComponent(m[1]);
    const valid = color === 'aleatoire' ? unionList.length > 0 : (manifest[color] && manifest[color].length > 0);
    if (!valid) { location.hash = '#/'; return; }
    enterDisplay(color);
  } else {
    leaveDisplay();
    renderHome();
  }
}

/* ---------- INIT ---------- */
document.getElementById('back-btn').addEventListener('click', () => { history.back(); });
document.getElementById('change-btn').addEventListener('click', changeTrain);
window.addEventListener('hashchange', route);

(async () => {
  await loadManifest();
  if (Object.keys(manifest).length === 0) {
    document.getElementById('grid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted)">Aucun <code>manifest.json</code>. Lance <code>./gen-manifest.sh</code>.</div>';
    return;
  }
  route();
})();
</script>
</body>
</html>
